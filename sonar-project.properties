sonar.host.url=https://sonarcloud.io
sonar.projectKey=SirDarquan_delisha-marie
sonar.organization=sirdarquan

# Set sources to root so that paths in lcov.info (which start with 'projects/...') match
sonar.sources=.
sonar.inclusions=projects/kitchen/**/*,projects/admin/**/*,projects/home/**/*,projects/dm/library/**/*
sonar.tests=.
sonar.test.inclusions=projects/kitchen/**/*.spec.ts,projects/kitchen/**/*.test.ts,projects/admin/**/*.spec.ts,projects/admin/**/*.test.ts,projects/home/**/*.spec.ts,projects/home/**/*.test.ts,projects/dm/library/**/*.spec.ts,projects/dm/backend-shared/**/*.test.ts
sonar.exclusions=node_modules/**, **/e2e/**, **/cypress/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Coverage reporting 
sonar.javascript.lcov.reportPaths=coverage/kitchen/lcov.info,coverage/delisha-marie-api/lcov.info,coverage/admin/lcov.info,coverage/admin-delisha-marie-api/lcov.info,coverage/@dm/library/lcov.info,coverage/@dm/backend-shared/lcov.info,coverage/home/lcov.info
