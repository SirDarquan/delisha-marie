sonar.projectKey=SirDarquan_delisha-marie
sonar.organization=sirdarquan

# Define sources and tests relative to the root
sonar.sources=projects/delisha-marie/src/app
sonar.tests=projects/delisha-marie/src/app
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Coverage reporting 
# Use both the language-specific and the generic properties for maximum compatibility
sonar.javascript.lcov.reportPaths=coverage/delisha-marie/lcov.info
sonar.typescript.lcov.reportPaths=coverage/delisha-marie/lcov.info
sonar.coverageReportPaths=coverage/delisha-marie/lcov.info