sonar.projectKey=SirDarquan_delisha-marie
sonar.organization=sirdarquan

# Define sources and tests relative to the root
# Using root (.) and inclusions/exclusions is more robust for path mapping in coverage reports
sonar.sources=.
sonar.inclusions=projects/delisha-marie/src/app/**/*.ts
sonar.tests=.
sonar.test.inclusions=projects/delisha-marie/src/app/**/*.spec.ts
sonar.exclusions=projects/delisha-marie/src/app/**/*.spec.ts, **/node_modules/**, **/dist/**, **/coverage/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Coverage reporting 
sonar.javascript.lcov.reportPaths=coverage/delisha-marie/lcov.info
sonar.typescript.lcov.reportPaths=coverage/delisha-marie/lcov.info
