name: Deploy to Cloud Run

on:
  schedule:
    - cron: '30 10 * * 2,4' # Tues and Thurs at 10:30 UTC (5:30 AM EST)
  workflow_dispatch: # Enable manual triggers

env:
  PROJECT_ID: 'delisha-marie'
  REGION: 'northamerica-south1'
  REPOSITORY_NAME: 'delisha-marie'

jobs:
  deploy-blog:
    name: Deploy Blog to Cloud Run
    runs-on: ubuntu-latest
    env:
      SERVICE_NAME: 'delisha-marie'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/644709001057/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-deployer@delisha-marie.iam.gserviceaccount.com'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: 'Configure Docker Auth'
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: 'Build and Push Container'
      run: |
        IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
        docker build -t "$IMAGE_URL" .
        docker push "$IMAGE_URL"

    - name: 'Deploy to Cloud Run'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: '${{ env.SERVICE_NAME }}'
        image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}'
        region: '${{ env.REGION }}'

  deploy-admin:
    name: Deploy Admin Dashboard to Cloud Run
    runs-on: ubuntu-latest
    env:
      SERVICE_NAME: 'admin-delisha-marie'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: 'projects/644709001057/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-deployer@delisha-marie.iam.gserviceaccount.com'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: 'Configure Docker Auth'
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: 'Build and Push Container'
      run: |
        IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
        docker build -f Dockerfile.admin -t "$IMAGE_URL" .
        docker push "$IMAGE_URL"

    - name: 'Deploy to Cloud Run'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: '${{ env.SERVICE_NAME }}'
        image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}'
        region: '${{ env.REGION }}'
