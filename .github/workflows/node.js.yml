# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Delisha-Marie CI
env:
  NODE_VERSION: 26.x

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Enable manual triggers

jobs:
  unit-tests:
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - run: npm ci --ignore-scripts
    - run: npm test
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v7
      # with:
      #   args: >
      #     -Dsonar.verbose=true
    # Check the Quality Gate status.
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
      with:
        pollingTimeoutSec: 600

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, blog]
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Run Cypress E2E Parallel Matrix
      uses: cypress-io/github-action@v7
      with:
        command: npm run e2e:${{ matrix.app }}
        install: true

  build:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - run: npm ci --ignore-scripts
    - run: npm run build delisha-marie --if-present
    - run: npm run build admin-delisha-marie --if-present

  Deploy-Preview:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
    - uses: actions/checkout@v2
    - name: Install Vercel CLI
      run: npm i -g --ignore-scripts vercel@latest
    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - name: Build Project Artifacts
      run: vercel build --token=$VERCEL_TOKEN
    - name: Deploy Project Artifacts to Vercel
      run: vercel deploy --prebuilt --token=$VERCEL_TOKEN